[project]
name = "tradelab-backend"
version = "0.1.0"
description = "Pivot: basketball decision intelligence — backend API, ingestion, and analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "nba_api==1.11.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "kagglehub>=0.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-Markdown",
]
# Ask Pivot / Pivot Intelligence — the experimental synthetic research assistant. Optional:
# nothing in the standard install, CI or the Docker image needs these, and the app imports
# them lazily, so `pip install -e ".[dev]"` keeps working unchanged. Minimums are the
# versions this was built and tested against (2026-10-17).
assistant = [
    "langchain-core>=1.6.12,<2",
    "langchain-ollama>=1.1.0,<2",
    "langsmith>=0.14.11,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: mypy
        run: mypy app
      # --cov-fail-under is a ratchet: raise it when a release genuinely improves
      # coverage, never lower it to make a run green. 68 % was the measured R0 baseline;
      # R5-5 covered the modelling and ingestion paths that carried it — jobs.py 0 → 77 %,
      # train.py 36 → 97 %, cli.py 0 → 92 % — taking the total to 88 %. The floor moves to
      # 85, which leaves headroom for a legitimate refactor without permitting a slide.
      - name: Tests (no network — recorded fixtures only)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Migration check (SQLite)
        # No `|| true`: R2 will produce model/migration drift and this is the only
        # check that detects it.
        run: |
          alembic upgrade head
          alembic check

  assistant:
    # Ask Pivot's LangChain path. The backend job installs only `.[dev]`, so every test that
    # builds the real runnable chain (fake chat model + fake embeddings) skips there. This
    # job adds the optional `assistant` extra and runs those tests plus the scorer
    # self-test. No Ollama, no LangSmith, no network beyond pip.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the assistant extra)
        run: pip install -e ".[dev,assistant]"
      - name: Ask Pivot tests (fakes only)
        run: pytest -q tests/unit -k assistant
      - name: Scorer self-test (every false answer must fail)
        run: python -m scripts.eval_rag selftest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build

  e2e:
    # Guards the decision flow the audit reproduced QA-1…QA-13 against. Runs against a
    # dedicated, freshly migrated database seeded with the SYNTHETIC demo league
    # (backend/app/ingestion/demo_seed.py) — never a developer's ingested data, and
    # never NBA.com at request time.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/rosterlab-e2e.db
      NEXT_PUBLIC_API_URL: http://localhost:8000
      E2E_BACKEND_CMD: cd ../backend && uvicorn app.main:app --port 8000
      E2E_FRONTEND_CMD: npm start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -e ./backend
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Migrate and seed the demo database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli seed-config
          python -m app.cli seed-demo
          python -m app.cli train
          python -m app.cli score
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  docker:
    # The `rosterlab-*` image tags below keep their historical spelling on purpose: they
    # are only local build tags for this job, and nothing downstream reads them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t rosterlab-backend ./backend
      - name: Build frontend image
        run: docker build -t rosterlab-frontend ./frontend
